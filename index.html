<!DOCTYPE html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MiRutina</title>

    <!-- Iconos locales por ruta relativa. -->
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />

    <!-- PWA ligera: manifest para instalar; el offline lo resuelve service-worker.js. -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#171717" />

    <link rel="stylesheet" href="styles.css" />

    <!-- tema e idioma antes del primer pintado, sin parpadeo. -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("mirutina.theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.dataset.theme = theme;
          }
          var lang = localStorage.getItem("mirutina.lang");
          if (lang === "es" || lang === "en") {
            document.documentElement.lang = lang;
          }
        } catch (e) {
          /* localStorage no disponible: quedan el tema oscuro y el español. */
        }
      })();
    </script>

    <!-- Scripts clásicos con defer, en orden de capas. -->
    <!-- i18n.js va primero: el resto de módulos consume sus cadenas y formatos. -->
    <script defer src="i18n.js"></script>
    <script defer src="domain.js"></script>
    <script defer src="storage.js"></script>
    <script defer src="ui.js"></script>
    <script defer src="charts.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <!-- aviso legible con JavaScript deshabilitado. -->
    <noscript>
      <p class="noscript-banner" role="alert" data-i18n="noscript">
        MiRutina necesita JavaScript para funcionar. Habilita JavaScript en tu
        navegador y recarga la página.
      </p>
    </noscript>

    <!-- Navbar negra fija: marca + 6 rutas hash + acciones. -->
    <header class="navbar">
      <div class="navbar-inner">
        <a class="navbar-brand" href="#/" aria-label="Mi Rutina, ir al inicio"
          data-i18n-aria="nav.home.aria">
          <svg class="brand-logo" width="26" height="26" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            aria-hidden="true" focusable="false">
            <rect x="3" y="3" width="18" height="18" rx="4" />
            <path d="M8 12.5l2.5 2.5L16 9" />
          </svg>
          <span class="navbar-logo">Mi Rutina</span>
        </a>
        <nav class="navbar-nav" aria-label="Navegación principal" data-i18n-aria="nav.primary">
          <a class="nav-link" href="#/">
            <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z" /></svg>
            <span data-i18n="nav.home">Inicio</span>
          </a>
          <a class="nav-link" href="#/rutinas">
            <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01" /></svg>
            <span data-i18n="nav.routines">Rutinas</span>
          </a>
          <a class="nav-link" href="#/registro">
            <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21.5 11.1V12a9.5 9.5 0 1 1-5.6-8.7" /><path d="M21.5 5L12 14.5l-3-3" /></svg>
            <span data-i18n="nav.log">Hoy</span>
          </a>
          <a class="nav-link" href="#/historial">
            <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4.5" width="18" height="16.5" rx="3" /><path d="M16 2.5v4M8 2.5v4M3 10h18" /></svg>
            <span data-i18n="nav.history">Historial</span>
          </a>
          <a class="nav-link" href="#/estadisticas">
            <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 3v18h18M8 17v-5M13 17V7M18 17v-8" /></svg>
            <span data-i18n="nav.stats">Estadísticas</span>
          </a>
          <a class="nav-link" href="#/objetivos">
            <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 21h8M12 17.5V21M7 4h10v6a5 5 0 0 1-10 0z" /><path d="M7 6H4v1.5a3.5 3.5 0 0 0 3.5 3.5M17 6h3v1.5a3.5 3.5 0 0 1-3.5 3.5" /></svg>
            <span data-i18n="nav.goals">Objetivos</span>
          </a>
        </nav>
        <div class="navbar-actions">
          <!-- Botón único de idioma: ofrece el idioma destino (ES↔EN), cambio al instante. -->
          <button type="button" class="lang-switch" id="lang-switch"
            aria-label="Cambiar a inglés" title="Cambiar a inglés">
            <svg class="icon lang-switch-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9" /><path d="M3 12h18" /><path d="M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z" /></svg>
            <span class="lang-label" id="lang-label">EN</span>
          </button>
          <!-- Ajustes: panel sin ruta propia. -->
          <a class="nav-link nav-settings-link" href="#" id="nav-settings"
            aria-label="Ajustes" data-i18n-aria="nav.settings">
            <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3.2" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
            <span data-i18n="nav.settings">Ajustes</span>
          </a>
          <!-- Toggle de tema: rellena por app.js. -->
          <button type="button" class="nav-icon-btn theme-toggle" id="nav-theme"
            aria-label="Cambiar al tema claro" title="Cambiar al tema claro"
            data-i18n-aria="nav.theme.toLight" data-i18n-title="nav.theme.toLight"></button>
        </div>
      </div>
    </header>

    <!-- Aviso persistente de localStorage bloqueado; lo pinta app.js. -->
    <div id="storage-banner-slot"></div>

    <!-- Recordatorio discreto de backup; lo pinta app.js si toca. -->
    <div id="backup-banner-slot"></div>

    <!-- Contenedor de pantalla activa; los re-render repintan dentro. -->
    <main id="app" class="app-main">
      <!-- 6 contenedores de pantalla, uno por ruta hash. -->
      <section class="screen" id="screen-inicio" data-route="#/" aria-label="Inicio" data-i18n-aria="section.inicio"></section>
      <section class="screen" id="screen-registro" data-route="#/registro" aria-label="Registro diario" data-i18n-aria="section.registro"></section>
      <section class="screen" id="screen-rutinas" data-route="#/rutinas" aria-label="Rutinas" data-i18n-aria="section.rutinas"></section>
      <section class="screen" id="screen-historial" data-route="#/historial" aria-label="Historial" data-i18n-aria="section.historial"></section>
      <section class="screen" id="screen-estadisticas" data-route="#/estadisticas" aria-label="Estadísticas" data-i18n-aria="section.estadisticas"></section>
      <section class="screen" id="screen-objetivos" data-route="#/objetivos" aria-label="Objetivos" data-i18n-aria="section.objetivos"></section>
    </main>

    <!-- Footer común a todas las pantallas. -->
    <footer class="app-footer">
      <p>
        <span class="footer-mark" aria-hidden="true"></span>
        <span id="footer-note">MiRutina © 2026 — Proyecto personal</span>
      </p>
    </footer>

    <!-- Modo offline: service worker solo en http(s); en file:// no se registra. -->
    <script>
      (function () {
        if (!/^https?:$/.test(location.protocol)) return;
        if (!("serviceWorker" in navigator)) return;
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("service-worker.js").catch(function () {
            /* sin service worker la app sigue funcionando igual */
          });
        });
      })();
    </script>
  </body>
</html>
